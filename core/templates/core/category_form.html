{% extends 'base.html' %}

{% block title %}{% if category %}تعديل قسم{% else %}إضافة قسم جديد{% endif %} - مطبخ الف هنا{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-folder"></i>
                    {% if category %}تعديل قسم{% else %}إضافة قسم جديد{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label">اسم القسم</label>
                        <input type="text" class="form-control" id="name" name="name" value="{% if category %}{{ category.name }}{% endif %}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">الوصف (اختياري)</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{% if category %}{{ category.description }}{% endif %}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="order" class="form-label">الترتيب</label>
                        <input type="number" class="form-control" id="order" name="order" value="{% if category %}{{ category.order }}{% else %}0{% endif %}" min="0">
                        <small class="text-muted">القيم الأصغر تظهر أولاً</small>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if category %}{% if category.is_active %}checked{% endif %}{% else %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">نشط</label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'menu_management' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-right"></i> رجوع
                        </a>
                        <button type="submit" class="btn btn-add">
                            <i class="bi bi-check-circle"></i> حفظ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
